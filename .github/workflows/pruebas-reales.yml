# El despliegue reutiliza las pruebas del código candidato. El chequeo del
# catálogo de producción corre en otro trabajo porque depende del servidor activo.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      omitir-catalogo:
        type: boolean
        default: false

concurrency:
  group: pruebas-${{ github.workflow }}-${{ github.ref }}   # distinto al llamarlo desde el despliegue: no se cancelan entre sí
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/real/package-lock.json
      - name: Dependencias del servidor
        run: npm ci --no-audit --no-fund
      - name: Pruebas rápidas (npm test)
        run: npm test
      - name: Dependencias de las pruebas reales
        working-directory: test/real
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Lurveta Blogs de extremo a extremo
        run: node test/real/blogs.js
      - name: Navegación, perfil, NEW y página puente (móvil y escritorio)
        run: node test/real/navegacion.js
      - name: Panel de administración y conciliación de PayPal (servidor real, móvil y escritorio)
        run: node test/real/admin.js
      - name: SEO (portada indexable, metadatos, vistas previas, datos estructurados y sitemap)
        run: node test/real/seo.js
      - name: Migración de la portada (puente, parámetros, fichas, service worker y actualización desde la versión anterior)
        run: node test/real/migracion.js
      - name: Economía adversarial (saltarse la espera, reciclar IPs y tickets, falsear vistas y descargas de blog)
        run: node test/real/economia.js

  catalogo-produccion:
    if: ${{ !inputs.omitir-catalogo }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/real/package-lock.json
      - name: Dependencias de las pruebas reales
        working-directory: test/real
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Portada y ficha con el catálogo real
        run: node test/real/portada.js
