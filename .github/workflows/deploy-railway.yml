# Verifica el despliegue automático y usa la CLI si todavía no llega el commit.
# RAILWAY_TOKEN habilita el respaldo. RAILWAY_SERVICE identifica el servicio.
name: Deploy Railway

on:
  push:
    branches: [main]
    paths:
      - 'index.js'
      - 'rutas/**'
      - 'modulos/**'
      - 'mediamtx/**'
      - 'package.json'
      - 'package-lock.json'
      - 'nixpacks.toml'
      - 'railway.toml'
      - 'public/pb2-touch.js'
      - 'public/pb2-touch.css'
      - 'public/upgames-ranking.js'
      - 'public/upgames-redes.js'
      - '.github/workflows/deploy-railway.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-railway
  cancel-in-progress: true

jobs:
  pruebas:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/pruebas-reales.yml
    with:
      omitir-catalogo: true

  desplegar:
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirmar la revisión publicada y desplegar si hace falta
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICIO: ${{ vars.RAILWAY_SERVICE || 'UpGames' }}
          SALUD_URL: https://upgames-production.up.railway.app/salud
        run: |
          esperar_revision() {
            for ((i=1; i<=$1; i++)); do
              if curl --fail --silent --show-error --max-time 10 "$SALUD_URL" |
                jq -e --arg commit "$revision" '.ok == true and .db == true and .commit == $commit' >/dev/null; then
                echo "Producción sirve $revision"
                return 0
              fi
              if (( i < $1 )); then sleep 15; fi
            done
            return 1
          }

          revision=$(git rev-parse HEAD)
          test "$revision" = "$GITHUB_SHA"
          if esperar_revision 7; then exit 0; fi

          if [ -n "$RAILWAY_TOKEN" ]; then
            # Un redeploy antiguo nunca debe reemplazar un main más reciente.
            remoto=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$remoto" != "$revision" ]; then
              echo "::error::main avanzó desde $revision hasta $remoto; se omite el despliegue de esta revisión."
              exit 1
            fi
            npm install --global @railway/cli@4.68.0
            printf '%s\n' "$revision" > .lurveta-build-commit
            railway up --ci --service "$SERVICIO"
          else
            echo "::warning::Falta RAILWAY_TOKEN. Se seguirá esperando el despliegue automático."
          fi

          if ! esperar_revision 20; then
            echo "::error::La API de producción no confirmó la revisión $revision."
            exit 1
          fi
